site_name: Byte-Sized Notes
site_url: https://ankit.codes
site_description: A blog about software engineering, programming, and technology.
site_author: Ankit

theme:
  name: shadcn
  custom_dir: overrides
  favicon: /img/favicon.ico
  katex_options:
    delimiters:
      - {left: "$$", right: "$$", display: true}
      - {left: "$", right: "$", display: false}
      - {left: "\\(", right: "\\)", display: false}
      - {left: "\\[", right: "\\]", display: true}

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/spa.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
